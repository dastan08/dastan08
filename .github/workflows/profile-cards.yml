
name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate language card
        uses: h1s97x/gh-readme-card@main
        with:
          card: langs
          params: "username=dastan08&layout=donut&langs_count=8&theme=tokyonight"
          path: profile/langs.svg

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/langs.svg
          git diff --staged --quiet || git commit -m "Update language statistics"
          git push
