
name: Update Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate language statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from html import escape

          username = "dastan08"
          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read())

          totals = {}

          page = 1
          while True:
              repos = github_get(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not repos:
                  break

              for repo in repos:
                  if repo["fork"] or repo["archived"]:
                      continue

                  languages = github_get(repo["languages_url"])

                  for language, amount in languages.items():
                      totals[language] = totals.get(language, 0) + amount

              if len(repos) < 100:
                  break

              page += 1

          ranked = sorted(
              totals.items(),
              key=lambda item: item[1],
              reverse=True
          )[:8]

          total = sum(amount for _, amount in ranked)

          colors = [
              "#3572A5", "#00ADD8", "#f1e05a", "#e34c26",
              "#563d7c", "#3178c6", "#4F5D95", "#dea584"
          ]

          width = 900
          height = 340
          rows = []

          for i, (language, amount) in enumerate(ranked):
              percentage = amount / total * 100 if total else 0
              y = 105 + i * 27
              bar_width = 440 * percentage / 100

              rows.append(f"""
                <text x="48" y="{y}" fill="#c9d1d9"
                      font-size="15">{escape(language)}</text>
                <rect x="220" y="{y-14}" width="440" height="10"
                      rx="5" fill="#30363d"/>
                <rect x="220" y="{y-14}" width="{bar_width:.2f}"
                      height="10" rx="5" fill="{colors[i % len(colors)]}"/>
                <text x="690" y="{y}" fill="#8b949e"
                      font-size="14">{percentage:.1f}%</text>
              """)

          if not ranked:
              rows.append(
                  '<text x="48" y="120" fill="#8b949e">'
                  'No public language data available</text>'
              )

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
              width="{width}" height="{height}" viewBox="0 0 {width} {height}">
            <rect width="100%" height="100%" rx="14" fill="#0d1117"/>
            <rect x="1" y="1" width="898" height="338" rx="13"
                  fill="none" stroke="#30363d"/>
            <text x="48" y="48" fill="#70a5fd"
                  font-size="19" font-weight="bold"
                  font-family="Arial, sans-serif">
              LANGUAGE DISTRIBUTION
            </text>
            <text x="48" y="72" fill="#8b949e"
                  font-size="12" font-family="Arial, sans-serif">
              Based on bytes across non-fork, non-archived public repositories
            </text>
            {''.join(rows)}
            <text x="48" y="316" fill="#484f58"
                  font-size="11" font-family="Arial, sans-serif">
              github.com/{username}
            </text>
          </svg>"""

          Path("profile").mkdir(exist_ok=True)
          Path("profile/langs.svg").write_text(svg, encoding="utf-8")
          print("Generated profile/langs.svg")
          PY

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/langs.svg
          git diff --staged --quiet || git commit -m "Update language statistics"
          git push
