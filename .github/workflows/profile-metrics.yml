
name: Update Profile Metrics

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate metrics panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          username = "dastan08"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read())

          profile = get(f"https://api.github.com/users/{username}")

          repos = []
          page = 1
          while True:
              batch = get(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          metrics = [
              ("PUBLIC REPOSITORIES", profile["public_repos"]),
              ("TOTAL STARS", sum(r["stargazers_count"] for r in repos)),
              ("TOTAL FORKS", sum(r["forks_count"] for r in repos)),
              ("FOLLOWERS", profile["followers"])
          ]

          cards = []
          for i, (label, value) in enumerate(metrics):
              x = 28 + i * 220
              cards.append(f"""
                <rect x="{x}" y="85" width="202" height="105"
                      rx="12" fill="#161b22" stroke="#30363d"/>
                <text x="{x+18}" y="119" fill="#8b949e"
                      font-size="12" letter-spacing="1"
                      font-family="Arial">{label}</text>
                <text x="{x+18}" y="163" fill="#70a5fd"
                      font-size="30" font-weight="bold"
                      font-family="Arial">{value:,}</text>
              """)

          updated = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
              width="900" height="225" viewBox="0 0 900 225">
            <rect width="900" height="225" rx="14" fill="#0d1117"/>
            <rect x="1" y="1" width="898" height="223" rx="13"
                  fill="none" stroke="#30363d"/>
            <text x="28" y="42" fill="#70a5fd"
                  font-size="19" font-weight="bold"
                  font-family="Arial">GITHUB / ENGINEERING METRICS</text>
            <text x="872" y="42" text-anchor="end"
                  fill="#8b949e" font-size="11"
                  font-family="Arial">LIVE PROFILE DATA</text>
            {''.join(cards)}
            <text x="28" y="211" fill="#484f58"
                  font-size="10" font-family="Arial">
              github.com/{username} · Updated {updated}
            </text>
          </svg>"""

          Path("profile").mkdir(exist_ok=True)
          Path("profile/metrics.svg").write_text(svg, encoding="utf-8")
          print("Generated profile/metrics.svg")
          PY

      - name: Commit metrics panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics.svg
          git diff --staged --quiet || git commit -m "Update GitHub metrics panel"
          git push
