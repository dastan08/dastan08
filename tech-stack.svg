
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="100"
     viewBox="0 0 1200 100">

  <defs>
    <clipPath id="viewport">
      <rect width="1200" height="100"/>
    </clipPath>
  </defs>

  <rect width="1200" height="100" fill="#0d1117"/>

  <g clip-path="url(#viewport)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-1152 0"
        dur="22s"
        repeatCount="indefinite"/>

      <g font-family="monospace"
         font-size="22"
         font-weight="bold"
         text-anchor="middle">

        <g transform="translate(24,15)">
          <rect width="124" height="70" rx="12" fill="#252a3a"/>
          <text x="62" y="43" fill="#f89820">JAVA</text>
        </g>

        <g transform="translate(164,15)">
          <rect width="124" height="70" rx="12" fill="#00add8"/>
          <text x="62" y="43" fill="#ffffff">GO</text>
        </g>

        <g transform="translate(304,15)">
          <rect width="124" height="70" rx="12" fill="#252a3a"/>
          <text x="62" y="43" fill="#ffd43b">PYTHON</text>
        </g>

        <g transform="translate(444,15)">
          <rect width="124" height="70" rx="12" fill="#007acc"/>
          <text x="62" y="43" fill="#ffffff">TS</text>
        </g>

        <g transform="translate(584,15)">
          <rect width="124" height="70" rx="12" fill="#6db33f"/>
          <text x="62" y="43" fill="#ffffff">SPRING</text>
        </g>

        <g transform="translate(724,15)">
          <rect width="124" height="70" rx="12" fill="#231f20"/>
          <text x="62" y="43" fill="#ffffff">KAFKA</text>
        </g>

        <g transform="translate(864,15)">
          <rect width="124" height="70" rx="12" fill="#dd0031"/>
          <text x="62" y="43" fill="#ffffff">ANGULAR</text>
        </g>

        <g transform="translate(1004,15)">
          <rect width="124" height="70" rx="12" fill="#087ea4"/>
          <text x="62" y="43" fill="#ffffff">REACT</text>
        </g>

        <!-- Duplicate sequence for seamless looping -->
        <g transform="translate(1152,0)">
          <g transform="translate(24,15)">
            <rect width="124" height="70" rx="12" fill="#252a3a"/>
            <text x="62" y="43" fill="#f89820">JAVA</text>
          </g>
          <g transform="translate(164,15)">
            <rect width="124" height="70" rx="12" fill="#00add8"/>
            <text x="62" y="43" fill="#ffffff">GO</text>
          </g>
          <g transform="translate(304,15)">
            <rect width="124" height="70" rx="12" fill="#252a3a"/>
            <text x="62" y="43" fill="#ffd43b">PYTHON</text>
          </g>
          <g transform="translate(444,15)">
            <rect width="124" height="70" rx="12" fill="#007acc"/>
            <text x="62" y="43" fill="#ffffff">TS</text>
          </g>
          <g transform="translate(584,15)">
            <rect width="124" height="70" rx="12" fill="#6db33f"/>
            <text x="62" y="43" fill="#ffffff">SPRING</text>
          </g>
          <g transform="translate(724,15)">
            <rect width="124" height="70" rx="12" fill="#231f20"/>
            <text x="62" y="43" fill="#ffffff">KAFKA</text>
          </g>
          <g transform="translate(864,15)">
            <rect width="124" height="70" rx="12" fill="#dd0031"/>
            <text x="62" y="43" fill="#ffffff">ANGULAR</text>
          </g>
          <g transform="translate(1004,15)">
            <rect width="124" height="70" rx="12" fill="#087ea4"/>
            <text x="62" y="43" fill="#ffffff">REACT</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
