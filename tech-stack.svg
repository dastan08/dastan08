        <g transform="translate(1340,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/postgresql/4169E1"/>
        </g>

        <g transform="translate(1472,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
