
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200"
     height="100"
     viewBox="0 0 1200 100">

  <defs>
    <clipPath id="viewport">
      <rect width="1200" height="100"/>
    </clipPath>
  </defs>

  <rect width="1200" height="100" fill="#0d1117"/>

  <g clip-path="url(#viewport)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-1584 0"
        dur="24s"
        repeatCount="indefinite"/>

      <!-- First sequence -->
      <g id="logos">

        <g transform="translate(20,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/openjdk/F89820"/>
        </g>

        <g transform="translate(152,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/go/00ADD8"/>
        </g>

        <g transform="translate(284,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/python/FFD43B"/>
        </g>

        <g transform="translate(416,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/typescript/3178C6"/>
        </g>

        <g transform="translate(548,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/spring/6DB33F"/>
        </g>

        <g transform="translate(680,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/apachekafka/FFFFFF"/>
        </g>

        <g transform="translate(812,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/angular/DD0031"/>
        </g>

        <g transform="translate(944,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/react/61DAFB"/>
        </g>

        <g transform="translate(1076,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
