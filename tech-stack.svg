        <g transform="translate(1208,10)">
          <rect width="112" height="80" rx="13" fill="#252a3a"/>
          <image x="35" y="19" width="42" height="42"
            xlink:href="https://cdn.simpleicons.org/tailwindcss/06B6D4"/>
